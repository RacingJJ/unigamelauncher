name: Launcher checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile launcher
        run: python -m py_compile UniGameLauncher_v1_2.py
      - name: Run helper regression tests
        run: python -m unittest discover -s tests -v
